<!doctype html><html><body style="margin:0;background:#9cc"><canvas id="c" width="2400" height="2000"></canvas>
<script type="module">
import * as T from './toon.js';
const c=document.getElementById('c'),g=c.getContext('2d');
const cell=(i,fn,label)=>{g.save();g.translate((i%6)*400,Math.floor(i/6)*1000);g.scale(400/600,1);g.fillStyle=i%2?'#a8d0a0':'#b8dcb0';g.fillRect(0,0,600,1000);fn(new T.Pen(g));g.restore();
 g.fillStyle='#000';g.font='20px Arial';g.fillText(label||'',(i%6)*400+8,Math.floor(i/6)*1000+24);};
const cells=(window.CELLS||[]);
const mode=location.hash.slice(1)||'trainer';
if(mode==='trainer'){
 cell(0,p=>T.trainerDraw(p,{expr:'smile'}),'stand smile');
 cell(1,p=>T.trainerDraw(p,{expr:'grin',far:'wave',near:'hip'}),'wave grin');
 cell(2,p=>T.trainerDraw(p,{expr:'yes',near:{to:[250,520],hand:'clicker',bend:-1},far:'thumb',click:1}),'yes click');
 cell(3,p=>T.trainerDraw(p,{expr:'focus',kneel:1,lean:14,far:{to:[560,800],hand:'treat',bend:1}}),'kneel treat');
 cell(4,p=>T.trainerDraw(p,{expr:'oops',kneel:1,lean:5,far:{to:[520,560],hand:'treat',bend:1}}),'oops high');
 cell(5,p=>T.trainerDraw(p,{expr:'patient',kneel:1,lean:8,far:{to:[540,760],hand:'give',bend:1},near:'hip'}),'give');
 cell(6,p=>T.trainerDraw(p,{expr:'talk',talk:0.6,far:'signal'}),'signal talk');
 cell(7,p=>T.trainerDraw(p,{expr:'laugh',far:'present',near:'thumb'}),'laugh');
 cell(8,p=>{p.g.translate(-300,-250);p.g.scale(2,2);T.trainerDraw(p,{expr:'smile'})},'head zoom');
 cell(9,p=>{p.g.translate(-300,-250);p.g.scale(2,2);T.trainerDraw(p,{expr:'yes',blink:0})},'head yes');
 cell(10,p=>{p.g.translate(-300,-250);p.g.scale(2,2);T.trainerDraw(p,{expr:'oops'})},'head oops');
 cell(11,p=>{p.g.translate(-300,-250);p.g.scale(2,2);T.trainerDraw(p,{expr:'patient',blink:1})},'head patient');
}else{
 const D={stand:{stand:1},sit:{sit:1},down:{down:1},flop:{flop:1}};
 const L=(x,y,z)=>[x,y,z];
 cell(0,p=>T.dogRoll(p,{legs:D.stand,look:L(260,170,40),mouth:'pant',tail:0.8,wag:0.4}),'stand');
 cell(1,p=>T.dogRoll(p,{legs:D.sit,look:L(240,240,60),mouth:'smile'}),'sit');
 cell(2,p=>T.dogRoll(p,{legs:D.down,look:L(260,90,40)}),'down');
 cell(3,p=>T.dogRoll(p,{legsF:D.down,legsR:D.down,rollF:0,rollR:60,look:L(250,90,60),eyes:'half'}),'hip settle');
 cell(4,p=>T.dogRoll(p,{legsF:D.down,legsR:D.down,rollF:15,rollR:65,look:L(90,90,140)}),'head to shoulder');
 cell(5,p=>T.dogRoll(p,{legs:D.flop,rollF:90,rollR:90,look:L(150,70,120),eyes:'happy'}),'on side');
 cell(6,p=>T.dogRoll(p,{legs:D.flop,rollF:135,rollR:120,look:L(120,140,60)}),'side->back');
 cell(7,p=>T.dogRoll(p,{legs:D.flop,rollF:180,rollR:180,look:L(120,150,-20),mouth:'pant'}),'back');
 cell(8,p=>T.dogRoll(p,{legs:D.flop,rollF:230,rollR:220,look:L(150,110,-80)}),'back->other');
 cell(9,p=>T.dogRoll(p,{legs:D.flop,rollF:270,rollR:270,look:L(200,80,-40)}),'other side');
 cell(10,p=>T.dogRoll(p,{legsF:{down:1},legsR:{down:1},rollF:360,rollR:330,look:L(260,100,40),mouth:'chew',chew:0.5}),'end down chew');
 cell(11,p=>T.dogRoll(p,{legsF:{down:0.5,stand:0.5},legsR:{down:0.5,stand:0.5},look:L(220,260,20),eyes:'wide'}),'getting up');
}
window.done=1;
</script></body></html>

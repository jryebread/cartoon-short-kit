<!doctype html><html><body style="margin:0"><canvas id="c" width="1800" height="1000"></canvas>
<script type="module">
import * as THREE from './lib/three.module.js';
import { GLTFLoader } from './lib/jsm/GLTFLoader.js';
import { makeDog } from './dogrig.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); r.setSize(1800, 1000, false); r.setScissorTest(true);
const g = await new GLTFLoader().loadAsync('models/dog-puppy.glb');
const dog = makeDog(g, { scale: 1.6 });
const sc = new THREE.Scene(); sc.background = new THREE.Color('#cfe0e8'); sc.add(dog.root); sc.add(new THREE.HemisphereLight('#fff', '#777', 2.6));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ color: '#9bb' })); floor.rotation.x = -Math.PI / 2; sc.add(floor);
const P = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '[]');
const cols = +(new URLSearchParams(location.search).get('cols') || 6), cw = 1800 / cols, ch = 500;
P.forEach((o, i) => {
  if (o.look) o.look = new THREE.Vector3(...o.look);
  dog.pose(o);
  const views = o.views || [[1, 0.35, 0.15], [0.55, 0.9, 0.6]];
  views.forEach((d, k) => {
    const cam = new THREE.PerspectiveCamera(32, cw / (ch / 2), 0.01, 50), c = new THREE.Vector3(...(o.center || [0, 0.12, 0.05]));
    cam.position.copy(c).addScaledVector(new THREE.Vector3(...d).normalize(), +(new URLSearchParams(location.search).get('dist') || 2.1)); cam.lookAt(c);
    const x = (i % cols) * cw, y = 1000 - (Math.floor(i / cols) + 1) * ch + (1 - k) * ch / 2;
    r.setViewport(x, y, cw, ch / 2); r.setScissor(x, y, cw, ch / 2); r.render(sc, cam);
  });
});
window.done = 1;
</script></body></html>
